<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Postflow - Instagram verbinden</title><style>body{font:16px system-ui,sans-serif;max-width:680px;margin:10vh auto;padding:25px;background:#0a1120;color:#f7f9ff;line-height:1.6}p{color:#cbd5e1}</style></head><body><h1>Instagram verbinden</h1><p id="status">Je wordt doorgestuurd naar Postflow op je computer. Houd Postflow open.</p><script>
(()=>{'use strict';const q=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);const code=q.get('code'),state=q.get('state'),error=q.get('error');const el=document.getElementById('status');if(error){el.textContent='Instagram gaf geen toestemming: '+error+'. Ga terug naar Postflow.';return;}if(!code||!state||code.length>4096||!/^[\w-]{16,120}$/.test(state)){el.textContent='Geen geldige aanmelding ontvangen. Probeer opnieuw vanuit Postflow.';return;}const target=new URL('http://127.0.0.1:8877/oauth/instagram/callback');target.searchParams.set('code',code);target.searchParams.set('state',state);location.replace(target.href);})();</script><noscript>Schakel JavaScript in om terug te keren naar Postflow.</noscript></body></html>
