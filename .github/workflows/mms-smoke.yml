name: MMS smoke checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check mms-stability.js
          node --check mms-calls.js
          node --check sw.js
          node --input-type=module --check < app.js
          node --input-type=module --check < crypto-core.js
          node --input-type=module --check < mms-access3.js
          node --input-type=module --check < mms-createfix.js
          node --input-type=module --check < guest.js
      - name: Static security and boot smoke checks
        run: node tests/mms-smoke.mjs
